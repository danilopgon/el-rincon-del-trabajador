name: Quality, E2E and deploy

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify site
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.18.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run quality gate
        run: pnpm quality

      - name: Build site
        run: pnpm build

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Run E2E tests
        run: pnpm test:e2e

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: site-dist
          path: dist
          if-no-files-found: error
          # dist/.htaccess carries the security and cache headers; hidden files are left out by default.
          include-hidden-files: true

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          if-no-files-found: ignore

  deploy:
    name: Deploy to hosting
    needs: verify
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    environment: production

    steps:
      - name: Checkout deploy scripts
        uses: actions/checkout@v4
        with:
          sparse-checkout: scripts

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: site-dist
          path: dist

      - name: Check build includes .htaccess
        run: test -f dist/.htaccess

      - name: Configure SSH
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_KEY: ${{ secrets.SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
          SSH_PASSPHRASE: ${{ secrets.SSH_PASSPHRASE }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
        run: |
          test -n "$SSH_HOST"
          test -n "$SSH_KEY"
          test -n "$SSH_KNOWN_HOSTS"
          test -n "$SSH_PASSPHRASE"
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          cat > ~/.ssh/askpass.sh <<'EOF'
          #!/usr/bin/env bash
          printf '%s\n' "$SSH_PASSPHRASE"
          EOF
          chmod 700 ~/.ssh/askpass.sh
          eval "$(ssh-agent -s)"
          echo "SSH_AUTH_SOCK=$SSH_AUTH_SOCK" >> "$GITHUB_ENV"
          echo "SSH_AGENT_PID=$SSH_AGENT_PID" >> "$GITHUB_ENV"
          DISPLAY=:0 SSH_ASKPASS=~/.ssh/askpass.sh SSH_ASKPASS_REQUIRE=force ssh-add ~/.ssh/deploy_key < /dev/null
          rm -f ~/.ssh/askpass.sh

      - name: Upload site to temporary directory
        env:
          REMOTE_PATH: ${{ secrets.REMOTE_PATH }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          test -n "$REMOTE_PATH"
          test -n "$SSH_HOST"
          test -n "$SSH_USER"
          test "$REMOTE_PATH" != "/"
          remote_tmp="${REMOTE_PATH%/}/.deploy-${GITHUB_SHA}"
          ssh -o BatchMode=yes -p "${SSH_PORT:-22}" "$SSH_USER@$SSH_HOST" \
            "set -eu; test -d '$REMOTE_PATH'; rm -rf '$remote_tmp'; mkdir -p '$remote_tmp'"
          scp -o BatchMode=yes -rP "${SSH_PORT:-22}" dist/. "$SSH_USER@$SSH_HOST:$remote_tmp/"

      - name: Publish uploaded site
        # scripts/publish-remote.sh syncs the upload into the docroot and keeps previous
        # /_astro/ assets, so HTML still cached by SiteGround never points at a deleted CSS/JS.
        env:
          REMOTE_PATH: ${{ secrets.REMOTE_PATH }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          test -n "$REMOTE_PATH"
          test -n "$SSH_HOST"
          test -n "$SSH_USER"
          test "$REMOTE_PATH" != "/"
          ssh -o BatchMode=yes -p "${SSH_PORT:-22}" "$SSH_USER@$SSH_HOST" \
            "bash -s -- '$REMOTE_PATH' '.deploy-${GITHUB_SHA}'" < scripts/publish-remote.sh

      - name: Purge SiteGround dynamic cache (best effort)
        # Not documented by SiteGround for non-WordPress sites; it must never fail the deploy.
        # The log shows the HTTP status so we can tell whether the purge is accepted.
        continue-on-error: true
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          status=$(ssh -o BatchMode=yes -p "${SSH_PORT:-22}" "$SSH_USER@$SSH_HOST" \
            "curl -s -o /dev/null -w '%{http_code}' -X PURGE -H 'Host: elrincondeltrabajador.com' 'http://127.0.0.1/*'") || true
          echo "SiteGround cache purge answered HTTP ${status:-none}"
